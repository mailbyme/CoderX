name: Release CoderX

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux
        run: cargo build --release

      - name: Package Linux
        run: |
          tar czf coderx-x86_64-unknown-linux-gnu.tar.gz -C target/release cx

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: coderx-x86_64-unknown-linux-gnu.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

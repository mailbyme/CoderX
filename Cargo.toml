[package]
name = "coderex"
version = "0.1.0"
edition = "2021"
description = "AI-Powered Coding Assistant - CoderX"
authors = ["CoderX Team"]
license = "MIT"
homepage = "https://coderex.dev"
repository = "https://github.com/coderex/coderex"
readme = "README.md"

[dependencies]
# Zero third-party dependencies - pure Rust standard library only!

[[bin]]
name = "cx"
path = "src/main.rs"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
codegen-units = 1
panic = "abort"
